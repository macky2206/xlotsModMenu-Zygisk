<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImGui Mod Menu Config</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4 font-sans">
    <div class="max-w-md mx-auto space-y-6">
        <header class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-400">Mod Menu Settings</h1>
            <button id="saveBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow transition">Save</button>
        </header>

        <!-- Master Switch -->
        <div class="bg-gray-800 p-4 rounded-lg flex justify-between items-center border-l-4 border-blue-500">
            <div>
                <h3 class="font-semibold">Master Enable</h3>
                <p class="text-xs text-gray-400">Enable/Disable the entire module</p>
            </div>
            <input type="checkbox" id="EnableModule" class="w-6 h-6 rounded bg-gray-700 checked:bg-blue-500 border-none">
        </div>

        <!-- Main Features -->
        <section class="space-y-3">
            <h2 class="text-gray-400 uppercase text-xs font-bold tracking-widest">Main Features</h2>
            <div id="featureList" class="bg-gray-800 rounded-lg divide-y divide-gray-700 overflow-hidden">
                <!-- Checkboxes will be injected here -->
            </div>
        </section>

        <!-- Multipliers -->
        <section class="space-y-3">
            <h2 class="text-gray-400 uppercase text-xs font-bold tracking-widest">Multipliers</h2>
            <div id="sliderList" class="bg-gray-800 p-4 rounded-lg space-y-6">
                <!-- Sliders will be injected here -->
            </div>
        </section>
    </div>

    <script>
        const configPath = "/data/local/tmp/imgui_config.txt";

        // Define settings structure
        const settings = {
            checkboxes: [
                { id: "NoCooldown", label: "No Spell Cooldown" },
                { id: "UnlimitedMana", label: "Unlimited Mana" },
                { id: "AlwaysLowestWave", label: "Always Lowest Wave" },
                { id: "UnlockTransmog", label: "Unlock All Transmogs" },
                { id: "SetRuneLevel", label: "Override Rune Level" },
                { id: "EnableExpeditionMultiplier", label: "Enable Expedition Multiplier" },
                { id: "FreeShopping", label: "Free Shopping" },
                { id: "Set0Prices", label: "Set Prices to 0" },
                // { id: "ShowMenu", label: "Show In-Game Menu Overlay" }
            ],
            sliders: [
                { id: "SpeedHackValue", label: "Speed Hack", min: 1, max: 25 },
                { id: "RuneLevel", label: "Custom Rune Level", min: 1, max: 20 },
                { id: "ExpeditionMultiplier", label: "Expedition Multiplier", min: 1, max: 20 }
            ]
        };

        // Render UI
        const featureList = document.getElementById('featureList');
        settings.checkboxes.forEach(item => {
            const div = document.createElement('div');
            div.className = "p-4 flex justify-between items-center hover:bg-gray-750 transition";
            div.innerHTML = `
                <label for="${item.id}" class="flex-1 cursor-pointer font-medium">${item.label}</label>
                <input type="checkbox" id="${item.id}" class="w-5 h-5 rounded bg-gray-700 checked:bg-blue-500 border-none">
            `;
            featureList.appendChild(div);
        });

        const sliderList = document.getElementById('sliderList');
        settings.sliders.forEach(item => {
            const div = document.createElement('div');
            div.innerHTML = `
                <div class="flex justify-between mb-2">
                    <span class="text-sm font-medium text-gray-300">${item.label}</span>
                    <span id="${item.id}_val" class="text-blue-400 font-bold">1</span>
                </div>
                <input type="range" id="${item.id}" min="${item.min}" max="${item.max}" value="1"
                    class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500"
                    oninput="document.getElementById('${item.id}_val').innerText = this.value">
            `;
            sliderList.appendChild(div);
        });

        // KSU Bridge Functions
        async function loadConfig() {
            try {
                // Read file via shell
                const { stdout } = await window.ksu.exec(`cat ${configPath}`);
                if (!stdout) return;

                const lines = stdout.split('\n');
                lines.forEach(line => {
                    const [key, value] = line.split('=');
                    if (!key) return;

                    const el = document.getElementById(key.trim());
                    if (el) {
                        if (el.type === 'checkbox') {
                            el.checked = value.trim() === '1';
                        } else {
                            el.value = value.trim();
                            const valDisplay = document.getElementById(`${key.trim()}_val`);
                            if (valDisplay) valDisplay.innerText = el.value;
                        }
                    }
                });
            } catch (e) {
                console.error("Failed to load config:", e);
            }
        }

        async function saveConfig() {
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "Saving...";
            saveBtn.disabled = true;

            try {
                let configStr = "";

                // Collect Master Switch
                const master = document.getElementById("EnableModule");
                configStr += `EnableModule=${master.checked ? '1' : '0'}\n`;

                // Collect Checkboxes
                settings.checkboxes.forEach(item => {
                    const el = document.getElementById(item.id);
                    configStr += `${item.id}=${el.checked ? '1' : '0'}\n`;
                });

                // Collect Sliders
                settings.sliders.forEach(item => {
                    const el = document.getElementById(item.id);
                    configStr += `${item.id}=${el.value}\n`;
                });

                // Write file via shell (KernelSU has root access)
                await window.ksu.exec(`printf "${configStr}" > ${configPath}`);

                // Set permissions
                await window.ksu.exec(`chmod 666 ${configPath}`);

                saveBtn.innerText = "Saved!";
                setTimeout(() => {
                    saveBtn.innerText = "Save";
                    saveBtn.disabled = false;
                }, 1500);
            } catch (e) {
                alert("Error saving config: " + e.message);
                saveBtn.innerText = "Save Error";
                saveBtn.disabled = false;
            }
        }

        document.getElementById('saveBtn').onclick = saveConfig;

        // Initialize
        if (window.ksu) {
            loadConfig();
        } else {
            document.body.innerHTML = '<div class="p-10 text-center text-red-500 font-bold">KernelSU Manager not detected. This WebUI only works inside the KernelSU app.</div>';
        }
    </script>
</body>
</html>
