name: Build Magisk Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. Advanced Gradle Caching (caches build outputs + dependencies)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 2. C/C++ Cache for NDK/ImGui compilation
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ndk-ccache

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 3. Single Gradle execution with build cache and parallel execution
    - name: Build Module
      run: ./gradlew :module:zipDebug :module:zipRelease --build-cache --parallel

    - name: Upload Debug Artifact
      uses: actions/upload-artifact@v4
      with:
        name: imgui-modmenu-debug
        path: out/*-debug.zip

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: imgui-modmenu-release
        path: out/*-release.zip
